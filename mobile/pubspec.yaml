name: spotify_lite
description: "Spotify Lite - Pemutar musik super cepat, hemat RAM, dan anti-lag dengan Background Playback"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^3.1.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
